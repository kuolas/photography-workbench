name: Bug report
description: Something does the wrong thing — the program, a script, a hook or the docs' instructions.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. photography-workbench is at an early stage, so a short, reproducible report is the most useful kind.

        **A security problem does not belong here** — the tracker is public. Report it privately as [SECURITY.md](https://github.com/kuolas/photography-workbench/blob/master/SECURITY.md) describes.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or actions that shows the problem.
      placeholder: |
        1. cargo run -- …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Nothing has been released yet, so the commit you built is the version — `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and `rustc --version`.
      placeholder: e.g. macOS 15.1, rustc 1.95.0
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste any relevant output; it is formatted as code automatically.
      render: text
  - type: checkboxes
    id: searched
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
