[package]
name = "photography-workbench"
description = "A fast desktop app for culling photos: rename by EXIF, rate sharpness and composition, pick keepers"
keywords = ["photography", "culling", "exif", "raw", "photo-viewer"]
categories = ["multimedia::images", "gui"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
catalog.workspace = true
desktop-ui.workspace = true
# Desktop only (ADR007): eframe's default wgpu renderer, plus `persistence`,
# which keeps the window geometry and the app's settings (such as the theme
# choice) between runs.
eframe = { workspace = true, features = ["persistence"] }
egui.workspace = true
env_logger.workspace = true
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The menu bar at the top of the screen. Its default features only add
# Linux's GTK menus, which the app does not use.
muda.workspace = true
# The window's handle, to measure macOS's window buttons at start-up and to
# make the menu bar only for a real window; the same version eframe uses.
raw-window-handle.workspace = true
# Only to turn off the menu bar winit makes by default (main.rs); the same
# version eframe uses, which does not pass that setting on.
winit.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
# Temporary folders for the folder tree's tests to browse.
tempfile.workspace = true
# tests/package_metadata.rs reads this file.
toml.workspace = true

# build.rs embeds the icon in the Windows executable; it does nothing for
# other targets.
[build-dependencies]
winresource.workspace = true

[lints]
workspace = true

# Desktop packaging with cargo-bundle (macOS .app, Linux .deb, Windows .msi).
# The identifier is permanent once released; it changes if the name does.
[package.metadata.bundle]
name = "Photography Workbench"
identifier = "io.github.kuolas.PhotographyWorkbench"
category = "public.app-category.photography"
short_description = "A fast desktop app for culling photos"
copyright = "Copyright (C) 2026 Alvaro Kuolas and the Photography Workbench contributors"
icon = ["assets/icon-256.png", "assets/icon-1024.png"]

# Version information in the Windows executable (build.rs). Windows shows
# FileDescription as the app's name, in Task Manager for one, so it is the
# display name rather than the package description. tests/package_metadata.rs
# checks that these agree with the bundle section and the app's window title.
[package.metadata.winresource]
FileDescription = "Photography Workbench"
ProductName = "Photography Workbench"
OriginalFilename = "photography-workbench.exe"
LegalCopyright = "Copyright (C) 2026 Alvaro Kuolas and the Photography Workbench contributors"
