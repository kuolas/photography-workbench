[package]
name = "desktop-ui"
description = "The custom widgets and shared parts of photography-workbench's window"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

# The GUI only: this crate knows nothing of photos (ADR013).
[dependencies]
# egui's own fonts back the window's typeface up (src/fonts.rs), its emoji
# fonts among them, which draw the arrow keys' symbols.
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
iconflow.workspace = true

[dev-dependencies]
egui_kittest.workspace = true

[lints]
workspace = true
