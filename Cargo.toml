# The workspace: small crates under crates/, laid out engine-first. See
# docs/architecture-decisions/adr013-a-workspace-of-small-crates.md.
[workspace]
resolver = "3"
members = ["crates/*"]

# One version for every crate (ADR012), and the package fields they share.
# Each crate takes them with `<field>.workspace = true`.
[workspace.package]
version = "0.1.0"
authors = ["Alvaro Kuolas <kuolas@gmail.com>"]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/kuolas/photography-workbench"
readme = "README.md"
# An application, not a library: no crate is published to crates.io (and the
# name is still a working title).
publish = false

# Every dependency, one version each. A crate names the ones it uses with
# `<name>.workspace = true`, adding the features it needs.
[workspace.dependencies]
# The workspace's own crates.
catalog = { path = "crates/catalog" }
desktop-ui = { path = "crates/desktop-ui" }
previews = { path = "crates/previews" }
# External crates.
eframe = "0.36"
egui = "0.36"
egui_kittest = "0.36"
env_logger = "0.11"
iconflow = { version = "2", default-features = false, features = ["pack-lucide"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
log = "0.4"
muda = { version = "0.21", default-features = false }
raw-files = "0.5"
raw-window-handle = "0.6"
tempfile = "3"
toml = "1"
winit = { version = "0.30", default-features = false }
winresource = "0.1"

# Code policy: docs/architecture-decisions/adr008-lints-and-release-profile.md
# Each crate takes these with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Smaller, faster release binaries; release builds take longer to compile.
# Profiles apply only from the workspace root.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Debug builds compile the dependencies with optimisations, and only the
# workspace's own crates without: decoding a photo with an unoptimised
# JPEG decoder takes seconds rather than a fraction of one, which makes
# the app built by `cargo run` too slow to try. The dependencies compile
# once; the workspace's crates still rebuild quickly, with full debug
# information.
[profile.dev.package."*"]
opt-level = 3
