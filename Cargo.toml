[package]
name = "photography-workbench"
version = "0.1.0"
authors = ["Alvaro Kuolas <kuolas@gmail.com>"]
edition = "2024"
rust-version = "1.95"
description = "A fast desktop app for culling photos: rename by EXIF, rate sharpness and composition, pick keepers"
license = "GPL-3.0-or-later"
repository = "https://github.com/kuolas/photography-workbench"
readme = "README.md"
keywords = ["photography", "culling", "exif", "raw", "photo-viewer"]
categories = ["multimedia::images", "gui"]
# An application, not a library: not published to crates.io (and the name is
# still a working title).
publish = false

[dependencies]
# Desktop only (ADR007): eframe's default wgpu renderer, plus `persistence`,
# which keeps the window geometry and egui's settings (such as the theme)
# between runs.
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }

# Code policy: docs/architecture-decisions/adr008-lints-and-release-profile.md
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Smaller, faster release binaries; release builds take longer to compile.
[profile.release]
lto = true
codegen-units = 1
strip = true
